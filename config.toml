baseURL = 'https://nabeelseedat.com/'
locale = 'en-us'
title = 'Nabeel Seedat'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[markup.goldmark.renderer]
  unsafe = true # Allow HTML in md files

# NOTE: every plain key must stay above the [params.*] sub-tables below.
# In TOML, keys after a sub-table header belong to that table, not to [params].
[params]
  description = "Member of Technical Staff at Lila Sciences, working on LLM post-training and frontier capabilities towards scientific superintelligence. Honorary Research Associate at Imperial College London. Research on LLM agents, evaluations, reinforcement learning and data-centric AI."

  # Used for JSON-LD jobTitle and the OG image alt text.
  # Only rendered under your name if no affiliations are set below.
  role = "Member of Technical Staff, Lila Sciences"

  email = "seedatnabeel@gmail.com"
  photo = "nabeel.jpg"
  ogImage = "/og.png"

  # Used for the twitter:site and twitter:creator card tags.
  twitterHandle = "NabeelSeedat01"

  # Number of news items shown before the "Show earlier news" expander.
  newsRecent = 8

  # Drop a PDF in static/ and set this to make the CV link appear.
  # cv = "/nabeel-seedat-cv.pdf"

  # Research interests displayed under the bio.
  interests = [
    "Foundation Models & Post-Training",
    "LLM Agents & Reasoning",
    "LLM Evaluation & Verification",
    "Reinforcement Learning",
    "Data-Centric AI & Synthetic Data",
    "AI for Scientific Discovery",
    "Trustworthy & Responsible AI",
  ]

# --- sub-tables: nothing above this line may move below it -------------------

# Affiliations row, shown under your name in the header.
#
# Lila Sciences is the primary affiliation, followed by Imperial College London.
#
# Both affiliations use text badges rather than logos.
# The `abbr` field controls the text displayed in each badge.

[[params.affiliations]]
  role = "Member of Technical Staff"
  org = "Lila Sciences"
  abbr = "Lila.ai"
  url = "https://www.lila.ai/"

[[params.affiliations]]
  role = "Honorary Research Associate"
  org = "Imperial College London"
  abbr = "Imperial"
  url = "https://www.imperial.ac.uk/computing/"

# Featured talk, shown between the bio and the publications.
#
# `url` accepts a YouTube link (watch / youtu.be / embed / bare ID)
# or a SlidesLive presentation link.
# Leave it empty and the section is skipped.
#
# `aspect` overrides the player shape. Defaults per provider:
# 16/9 for YouTube, 500/199 for SlidesLive.
#
# `poster` + `link` render a click-through card instead of an inline player.

[params.video]
  heading = "Featured talk"
  url = "https://slideslive.com/39013504"
  title = "Data-Centric AI for reliable and responsible AI: from theory to practice"
  caption = "NeurIPS 2023 Tutorial, with Isabelle Guyon and Mihaela van der Schaar."
  # SlidesLive refuses to be embedded off its own domains, so this renders as a
  # click-through card. Thumbnail is SlidesLive's own, served locally.
  poster = "talk-neurips2023.png"
  provider = "SlidesLive"

# Shown in the header and footer, in this order.

[[params.social]]
  name = "twitter"
  url = "https://twitter.com/NabeelSeedat01"

[[params.social]]
  name = "scholar"
  url = "https://scholar.google.com/citations?hl=en&user=nUZG1SEAAAAJ"

[[params.social]]
  name = "github"
  url = "https://github.com/seedatnabeel"

[[params.social]]
  name = "linkedin"
  url = "https://linkedin.com/in/nabeel-seedat"

# Anchor nav. Weights control order.

[[menu.main]]
  name = "About"
  url = "#about"
  weight = 1

[[menu.main]]
  name = "Publications"
  url = "#publications"
  weight = 2

[[menu.main]]
  name = "Awards"
  url = "#awards"
  weight = 3

[[menu.main]]
  name = "News"
  url = "#news"
  weight = 4

[[menu.main]]
  name = "Talks"
  url = "#talks"
  weight = 5
