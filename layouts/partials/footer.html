<footer class="footer">
  <div class="footer__inner">
    <div class="footer__links">
      {{- with site.Params.email }}
      <a href="mailto:{{ . }}">{{ . }}</a>
      {{- end }}
      {{- range site.Params.social }}
      <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
      {{- end }}
      {{- with site.Params.cv }}
      <a href="{{ . }}">cv</a>
      {{- end }}
    </div>
    <div>&copy; {{ now.Year }} {{ site.Title }}</div>
  </div>
</footer>
