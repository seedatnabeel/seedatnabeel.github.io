# Publications, grouped by research topic.
#
# Reconciled against Google Scholar, Semantic Scholar and DBLP on 2026-08-13.
# Titles and venues follow the Google Scholar profile (author-curated) where the
# three sources disagreed; several camera-ready titles differ from the versions
# previously listed on this site.
#
# Each entry: title, authors, venue, year, topic, optional `links`,
# optional `preprint: true`, optional `highlight: true`.
#   topic     — must match one of `topicOrder` below. Anything not listed there
#               still renders, appended alphabetically after the rest.
#   year      — used to order entries within a topic, newest first.
#   preprint  — renders a small "Preprint" tag; use for arXiv-only work.
#   links     — open map. `paper`, `code`, `bibtex`, `slides`, `poster`,
#               `video`, `project` all render automatically.
#   highlight — set true on a few entries to surface a "Selected" group on top.

# Groups listed here render collapsed; everything else opens by default.
